services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ciclobox
      POSTGRES_PASSWORD: ciclobox
      POSTGRES_DB: ciclobox
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciclobox -d ciclobox"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  db-data:
